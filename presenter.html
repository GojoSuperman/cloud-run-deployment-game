<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cloud Run 무중단 배포 Auto-Presenter</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;600&display=swap');
:root{
  --bg:#0a0e1a;--card:#121828;--card2:#1a2240;
  --accent:#00d4ff;--accent2:#7c4dff;--green:#00e676;--red:#ff5252;--orange:#ffab40;--yellow:#ffd740;
  --blue-rev:#448aff;--green-rev:#00e676;
  --text:#e0e6f0;--text2:#7a8599;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.6 'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh}

/* ── 레이아웃 ── */
.presenter{display:grid;grid-template-rows:auto 1fr auto;height:100vh}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;
  background:rgba(18,24,40,.9);border-bottom:1px solid rgba(255,255,255,.06);backdrop-filter:blur(10px)}
.top-bar h1{font-size:1rem;font-weight:600;display:flex;align-items:center;gap:8px}
.top-bar h1 span{color:var(--accent)}
.step-indicator{display:flex;gap:6px;align-items:center}
.step-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.15);transition:all .4s}
.step-dot.active{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.step-dot.done{background:var(--green)}

.main-stage{position:relative;overflow:hidden}

.bottom-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;
  background:rgba(18,24,40,.9);border-top:1px solid rgba(255,255,255,.06);backdrop-filter:blur(10px)}
.controls{display:flex;gap:8px;align-items:center}
.ctrl-btn{background:var(--card2);border:1px solid rgba(255,255,255,.1);color:var(--text);border-radius:8px;
  padding:8px 16px;font:inherit;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}
.ctrl-btn:hover{background:rgba(0,212,255,.1);border-color:var(--accent)}
.ctrl-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;font-weight:600}
.ctrl-btn.primary:hover{transform:scale(1.03)}
.ctrl-btn:disabled{opacity:.3;cursor:not-allowed}
.speed-badge{font-size:.75rem;color:var(--text2)}
.step-title{font-size:.9rem;color:var(--text2)}

/* ── 슬라이드 공통 ── */
.slide{position:absolute;inset:0;display:flex;align-items:safe center;justify-content:center;
  opacity:0;transform:translateX(60px);transition:all .5s ease-out;pointer-events:none;padding:16px 40px;overflow-y:auto}
.slide.active{opacity:1;transform:translateX(0);pointer-events:auto}
.slide.exit{opacity:0;transform:translateX(-60px)}

.slide-content{max-width:1200px;width:100%;display:flex;flex-direction:column;gap:10px}
.slide-header{text-align:center}
.slide-header .num{font-size:.9rem;color:var(--accent);font-weight:700;letter-spacing:2px}
.slide-header h2{font-size:2.4rem;font-weight:800;margin-top:2px}
.slide-header h2 em{font-style:normal;background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.slide-header p{color:var(--text2);margin-top:4px;font-size:1rem}

/* ── 파이프라인 시각화 ── */
.pipeline{display:flex;align-items:center;justify-content:center;gap:0;flex-wrap:wrap;margin:10px 0}
.pipe-node{background:var(--card);border:2px solid rgba(255,255,255,.08);border-radius:12px;
  padding:10px 14px;min-width:90px;text-align:center;position:relative;transition:all .5s;opacity:.4}
.pipe-node.lit{opacity:1;border-color:var(--accent);box-shadow:0 0 20px rgba(0,212,255,.2)}
.pipe-node.pass{opacity:1;border-color:var(--green);box-shadow:0 0 20px rgba(0,230,118,.15)}
.pipe-node.fail{opacity:1;border-color:var(--red);box-shadow:0 0 20px rgba(255,82,82,.15)}
.pipe-node .p-icon{font-size:1.3rem;margin-bottom:2px}
.pipe-node .p-label{font-size:.72rem;font-weight:600}
.pipe-node .p-status{font-size:.65rem;margin-top:2px;font-weight:500}
.pipe-node .p-status.ok{color:var(--green)}
.pipe-node .p-status.err{color:var(--red)}
.pipe-node .p-status.run{color:var(--accent);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.pipe-arrow{font-size:1.2rem;color:rgba(255,255,255,.15);margin:0 6px;transition:color .4s}
.pipe-arrow.lit{color:var(--accent)}
.pipe-arrow.pass{color:var(--green)}

/* ── 트래픽 시각화 ── */
.traffic-viz{display:flex;gap:24px;justify-content:center;align-items:stretch;flex-wrap:wrap;margin:20px 0}
.rev-box{background:var(--card);border-radius:16px;padding:16px 20px;flex:1;min-width:200px;max-width:350px;
  border:2px solid rgba(255,255,255,.06);transition:all .5s;position:relative;overflow:hidden}
.rev-box.blue{border-color:var(--blue-rev)}
.rev-box.green-r{border-color:var(--green-rev)}
.rev-box .rev-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.rev-box .rev-name{font-weight:700;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.rev-box .rev-badge{font-size:.75rem;padding:3px 10px;border-radius:20px;font-weight:600}
.rev-box.blue .rev-badge{background:rgba(68,138,255,.15);color:var(--blue-rev)}
.rev-box.green-r .rev-badge{background:rgba(0,230,118,.15);color:var(--green-rev)}
.traffic-pct{font-size:3rem;font-weight:900;text-align:center;margin:10px 0;transition:all .5s}
.traffic-pct.blue-c{color:var(--blue-rev)}
.traffic-pct.green-c{color:var(--green-rev)}
.traffic-bar{height:10px;background:rgba(255,255,255,.06);border-radius:5px;overflow:hidden;margin-top:8px}
.traffic-fill{height:100%;border-radius:5px;transition:width 1s ease-out}
.traffic-fill.bf{background:linear-gradient(90deg,var(--blue-rev),#82b1ff)}
.traffic-fill.gf{background:linear-gradient(90deg,var(--green-rev),#69f0ae)}
.rev-tag{position:absolute;top:8px;right:12px;font-size:.7rem;background:rgba(0,212,255,.1);
  color:var(--accent);padding:2px 8px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .4s}
.rev-tag.show{opacity:1}

/* ── 요청 시뮬레이터 ── */
.req-monitor{background:var(--card);border-radius:14px;padding:20px;border:1px solid rgba(255,255,255,.06)}
.req-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.req-header h4{font-size:.9rem;font-weight:600;display:flex;align-items:center;gap:6px}
.req-stats{display:flex;gap:16px}
.req-stat{text-align:center}
.req-stat .rs-num{font-size:1.8rem;font-weight:800}
.req-stat .rs-num.ok{color:var(--green)}
.req-stat .rs-num.fail{color:var(--red)}
.req-stat .rs-label{font-size:.7rem;color:var(--text2)}
.req-log{height:200px;overflow-y:auto;font-family:var(--mono);font-size:.85rem;line-height:1.8;
  background:rgba(0,0,0,.3);border-radius:8px;padding:12px;margin-top:8px}
.req-log::-webkit-scrollbar{width:4px}
.req-log::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
.req-line.ok{color:var(--green)}
.req-line.err{color:var(--red)}
.req-line .ts{color:var(--text2)}
.req-line .rev{color:var(--accent)}

/* ── 터미널 ── */
.term{background:#0d1117;border:1px solid #30363d;border-radius:10px;overflow:hidden;margin:4px 0}
.term-top{background:#161b22;padding:6px 12px;display:flex;align-items:center;gap:6px}
.term-dot{width:9px;height:9px;border-radius:50%}
.term-dot.r{background:#ff5f57}.term-dot.y{background:#febc2e}.term-dot.g{background:#28c840}
.term-label{font-size:.7rem;color:#8b949e;margin-left:8px}
.term-body{padding:12px 14px;font-family:var(--mono);font-size:.8rem;line-height:1.55;color:#c9d1d9;
  white-space:pre-wrap}
.term-body .cmd{color:#f0f6fc;font-weight:600}
.term-body .g{color:var(--green)}
.term-body .r{color:var(--red)}
.term-body .c{color:var(--accent)}
.term-body .d{color:#6e7681}
.term-body .y{color:var(--yellow)}

/* ── 설명 카드 ── */
.explain-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:8px 0}
.explain-card{background:var(--card);border-radius:10px;padding:12px 14px;border:1px solid rgba(255,255,255,.04);
  transition:all .3s}
.explain-card:hover{border-color:rgba(0,212,255,.15)}
.explain-card .ec-icon{font-size:1.2rem;margin-bottom:4px}
.explain-card h5{font-size:.88rem;font-weight:700;margin-bottom:3px}
.explain-card p{font-size:.8rem;color:var(--text2);line-height:1.4}

/* ── 결론 슬라이드 ── */
.conclusion{text-align:center;padding:40px 0}
.conclusion h2{font-size:2rem;font-weight:900;margin-bottom:16px}
.conclusion h2 em{font-style:normal;color:var(--green)}
.conclusion .big-stats{display:flex;justify-content:center;gap:32px;margin:24px 0;flex-wrap:wrap}
.conclusion .big-stat{text-align:center}
.conclusion .big-stat .bs-num{font-size:3rem;font-weight:900}
.conclusion .big-stat .bs-num.g{color:var(--green)}
.conclusion .big-stat .bs-num.a{color:var(--accent)}
.conclusion .big-stat .bs-num.o{color:var(--orange)}
.conclusion .big-stat .bs-label{font-size:.85rem;color:var(--text2);margin-top:4px}
.check-list{text-align:left;max-width:500px;margin:24px auto;background:var(--card);border-radius:14px;padding:20px}
.check-item{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:.92rem;
  border-bottom:1px solid rgba(255,255,255,.04)}
.check-item:last-child{border:none}
.check-item .ci{color:var(--green);font-size:1.1rem}

/* ── 인트로/아웃트로 ── */
.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  min-height:100%;position:relative}
.cover .cover-bg{position:absolute;inset:0;z-index:0;overflow:hidden}
.cover .cover-bg .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;animation:orbFloat 8s ease-in-out infinite}
.orb-1{width:400px;height:400px;background:var(--accent);top:-10%;left:-10%;animation-delay:0s}
.orb-2{width:350px;height:350px;background:var(--accent2);bottom:-10%;right:-10%;animation-delay:2s}
.orb-3{width:250px;height:250px;background:var(--green);top:30%;right:20%;animation-delay:4s}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-20px) scale(1.1)}}
.cover-inner{position:relative;z-index:1}
.cover .cover-icon{font-size:4rem;margin-bottom:16px;animation:coverPulse 2s ease-in-out infinite}
@keyframes coverPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.cover h2{font-size:2.6rem;font-weight:900;line-height:1.3;margin-bottom:12px}
.cover h2 em{font-style:normal;background:linear-gradient(135deg,var(--accent),var(--accent2),var(--green));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% 200%;
  animation:gradShift 4s ease-in-out infinite}
@keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.cover .cover-sub{font-size:1.1rem;color:var(--text2);margin-top:8px;font-weight:400}
.cover .cover-meta{display:flex;gap:24px;margin-top:28px;flex-wrap:wrap;justify-content:center}
.cover .meta-item{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:12px;
  padding:10px 18px;font-size:.85rem;display:flex;align-items:center;gap:8px}
.cover .meta-item span{color:var(--accent);font-weight:700}
.cover .cover-line{width:60px;height:3px;border-radius:2px;margin:20px auto 0;
  background:linear-gradient(90deg,var(--accent),var(--accent2))}

.thanks h2{font-size:2.8rem}
.thanks .thanks-emoji{font-size:5rem;margin-bottom:20px;animation:coverPulse 2s ease-in-out infinite}
.thanks .thanks-sub{font-size:1.2rem;color:var(--text2);margin-top:12px}
.thanks .thanks-links{display:flex;gap:16px;margin-top:28px;flex-wrap:wrap;justify-content:center}
.thanks .tl{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:12px;
  padding:10px 20px;font-size:.85rem;display:flex;align-items:center;gap:8px;transition:all .3s}
.thanks .tl:hover{border-color:var(--accent);background:rgba(0,212,255,.05)}
.thanks .tl .tl-icon{font-size:1.2rem}

/* ── 배경 ── */
.bg-grid{position:fixed;inset:0;z-index:-1;
  background-image:radial-gradient(circle at 1px 1px, rgba(0,212,255,.04) 1px, transparent 0);
  background-size:40px 40px}

/* ── 반응형 ── */
@media(max-width:700px){
  .slide{padding:20px}
  .slide-header h2{font-size:1.3rem}
  .traffic-viz{flex-direction:column}
  .pipeline{flex-direction:column;gap:4px}
  .pipe-arrow{transform:rotate(90deg)}
  .traffic-pct{font-size:1.8rem}
  .conclusion .big-stat .bs-num{font-size:2rem}
}
</style>
</head>
<body>
<div class="bg-grid"></div>

<div class="presenter">
  <!-- 상단바 -->
  <div class="top-bar">
    <h1>☁️ <span>Cloud Run 무중단 배포</span> — Auto Presenter</h1>
    <div class="step-indicator" id="stepDots"></div>
  </div>

  <!-- 메인 스테이지 -->
  <div class="main-stage" id="stage"></div>

  <!-- 하단바 -->
  <div class="bottom-bar">
    <div class="step-title" id="stepTitle">시작하기</div>
    <div class="controls">
      <button class="ctrl-btn" id="prevBtn" onclick="prev()" disabled>← 이전</button>
      <button class="ctrl-btn primary" id="playBtn" onclick="togglePlay()">▶ 자동 재생</button>
      <button class="ctrl-btn" id="nextBtn" onclick="next()">다음 →</button>
      <button class="ctrl-btn" id="voiceBtn" onclick="toggleVoice()">🔊 음성</button>
      <button class="ctrl-btn" id="fsBtn" onclick="toggleFS()">⛶ 전체화면</button>
      <span class="speed-badge" id="speedBadge">5초/슬라이드</span>
    </div>
  </div>
</div>

<script>
const SLIDES = [
  // INTRO: 포토그래픽 커버
  {
    title:'표지',
    build:()=>`<div class="slide-content">
      <div class="cover">
        <div class="cover-bg">
          <div class="orb orb-1"></div>
          <div class="orb orb-2"></div>
          <div class="orb orb-3"></div>
        </div>
        <div class="cover-inner">
          <div class="cover-icon">☁️</div>
          <h2>Cloud Run으로<br><em>무중단 배포</em> 하기</h2>
          <p class="cover-sub">PR 머지 한 번으로 완성하는 블루그린 자동 배포 파이프라인</p>
          <div class="cover-line"></div>
          <div class="cover-meta">
            <div class="meta-item">📚 <span>9강</span></div>
            <div class="meta-item">👤 <span>모두의연구소</span></div>
            <div class="meta-item">⏱️ <span>5분 발표</span></div>
          </div>
        </div>
      </div>
    </div>`
  },
  // 0: 타이틀 (개요)
  {
    title:'Cloud Run 무중단 배포 워크플로',
    build:()=>`<div class="slide-content">
      <div class="slide-header">
        <div class="num">9강 · WORKFLOW PRESENTATION</div>
        <h2>머지 한 번으로<br><em>무중단 배포</em> 만들기</h2>
        <p>PR 머지 → CI → 이미지 빌드 → 0% 배포 → 스모크 테스트 → 전환<br>사람이 하는 일은 <strong>머지</strong>와 <strong>승인</strong>뿐</p>
      </div>
      <div class="pipeline" id="pipe0">
        ${pipeHTML(['🔀 PR 머지','🧪 CI 테스트','🐳 이미지 빌드','☁️ 0% 배포','🔍 스모크 테스트','✅ 전환'],[])}
      </div>
      <div class="explain-grid">
        <div class="explain-card"><div class="ec-icon">🎯</div><h5>목표</h5><p>배포 중 사용자 오류 0건, 망가진 버전은 전환 안 됨</p></div>
        <div class="explain-card"><div class="ec-icon">⚡</div><h5>핵심</h5><p>Cloud Run이 로드밸런서를 운영하고, 트래픽 설정만 바꿔서 전환</p></div>
        <div class="explain-card"><div class="ec-icon">🔄</div><h5>롤백</h5><p>트래픽 설정만 되돌리면 몇 초 만에 이전 버전으로 복구</p></div>
      </div>
    </div>`
  },
  // 1: PR 머지 → CI
  {
    title:'STEP 1 — PR 머지 & CI 테스트',
    build:()=>`<div class="slide-content">
      <div class="slide-header">
        <div class="num">STEP 1</div>
        <h2>PR 머지 & <em>CI 테스트</em></h2>
        <p>main에 머지되면 GitHub Actions가 자동으로 시작됩니다</p>
      </div>
      <div class="pipeline" id="pipe1">
        ${pipeHTML(['🔀 PR 머지','🧪 CI 테스트','🐳 이미지 빌드','☁️ 0% 배포','🔍 스모크 테스트','✅ 전환'],['lit','lit'])}
      </div>
      <div class="term">
        <div class="term-top"><div class="term-dot r"></div><div class="term-dot y"></div><div class="term-dot g"></div><span class="term-label">GitHub Actions — CI</span></div>
        <div class="term-body"><span class="d"># PR이 main에 머지됨 → CI 워크플로 트리거</span>
<span class="cmd">Run pytest tests/</span>
<span class="g">✓</span> test_health.py <span class="g">PASSED</span>
<span class="g">✓</span> test_version.py <span class="g">PASSED</span>
<span class="g">✓</span> test_chat.py <span class="g">PASSED</span>
<span class="g">══ 3 passed in 4.21s ══</span>

<span class="cmd">Run ruff check .</span>
<span class="g">All checks passed!</span></div>
      </div>
      <div class="explain-grid">
        <div class="explain-card"><div class="ec-icon">🔀</div><h5>트리거</h5><p>main 브랜치에 push(머지)되면 deploy.yml이 자동 시작</p></div>
        <div class="explain-card"><div class="ec-icon">🧪</div><h5>CI 테스트</h5><p>pytest로 단위 테스트, ruff로 코드 스타일 검사</p></div>
        <div class="explain-card"><div class="ec-icon">🛡️</div><h5>게이트</h5><p>테스트 실패 시 다음 단계로 가지 않음</p></div>
      </div>
    </div>`
  },
  // 2: 이미지 빌드
  {
    title:'STEP 2 — Docker 이미지 빌드 & 푸시',
    build:()=>`<div class="slide-content">
      <div class="slide-header">
        <div class="num">STEP 2</div>
        <h2>Docker 이미지 <em>빌드 & 푸시</em></h2>
        <p>Artifact Registry에 새 이미지를 올립니다</p>
      </div>
      <div class="pipeline" id="pipe2">
        ${pipeHTML(['🔀 PR 머지','🧪 CI 테스트','🐳 이미지 빌드','☁️ 0% 배포','🔍 스모크 테스트','✅ 전환'],['pass','pass','lit'])}
      </div>
      <div class="term">
        <div class="term-top"><div class="term-dot r"></div><div class="term-dot y"></div><div class="term-dot g"></div><span class="term-label">GitHub Actions — Build</span></div>
        <div class="term-body"><span class="d"># Workload Identity Federation으로 인증 (키 파일 없음)</span>
<span class="cmd">docker build -t us-central1-docker.pkg.dev/$PROJECT/repo/friend-agent:$SHA .</span>
<span class="d">[1/5] FROM python:3.12-slim</span>
<span class="d">[2/5] COPY requirements.txt .</span>

function pipeHTML(labels,states){
  return labels.map((l,i)=>{
    const s=states[i]||'';
    const statusTxt=s==='pass'?'<div class="p-status ok">✓ 완료</div>':s==='lit'?'<div class="p-status run">● 실행 중</div>':s==='fail'?'<div class="p-status err">✗ 실패</div>':'';
    return (i>0?`<span class="pipe-arrow ${s==='pass'||s==='lit'?'lit':''} ${s==='pass'?'pass':''}">→</span>`:'')+
      `<div class="pipe-node ${s}">${l.split(' ').length>1?`<div class="p-icon">${l.split(' ')[0]}</div><div class="p-label">${l.split(' ').slice(1).join(' ')}</div>`:`<div class="p-label">${l}</div>`}${statusTxt}</div>`;
  }).join('');
}

function animTraffic(id,bFrom,gFrom,bTo,gTo){
  const blueEl=document.getElementById(id+'-blue');
  const greenEl=document.getElementById(id+'-green');
  const blueBar=document.getElementById(id+'-blue-bar');
  const greenBar=document.getElementById(id+'-green-bar');
  if(!blueEl)return;
  let t=0;const dur=40;
  const timer=setInterval(()=>{
    t++;const p=Math.min(t/dur,1);
    const bv=Math.round(bFrom+(bTo-bFrom)*p);
    const gv=Math.round(gFrom+(gTo-gFrom)*p);
    blueEl.textContent=bv+'%';greenEl.textContent=gv+'%';
    blueBar.style.width=bv+'%';greenBar.style.width=gv+'%';
    if(t>=dur)clearInterval(timer);
  },30);
}
function showTag(id){const el=document.getElementById(id);if(el)el.classList.add('show')}

let reqSimTimer=null;
function runReqSim(){
  const log=document.getElementById('reqLog');
  const okEl=document.getElementById('reqOk');
  const failEl=document.getElementById('reqFail');
  if(!log)return;
  let ok=0,fail=0,i=0;
  const revs=['rev-1','rev-1','rev-1','rev-1','rev-1','rev-1','rev-1','rev-1','rev-2','rev-2','rev-2','rev-2','rev-2','rev-2','rev-2','rev-2','rev-2','rev-2'];
  clearInterval(reqSimTimer);
  reqSimTimer=setInterval(()=>{
    if(i>=revs.length){clearInterval(reqSimTimer);
      log.innerHTML+=`\n<span class="ts">═══ 요약 ═══</span>\n총 요청: <span class="rev">${ok}</span>  실패: <span class="ok">0</span>\nrev-1: 8건  rev-2: 10건\n<span class="ok">✓ 무중단 전환 증명 완료</span>`;
      log.scrollTop=log.scrollHeight;return;
    }
    const now=new Date();const ts=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
    ok++;okEl.textContent=ok;
    const rev=revs[i];
    const marker=i===8?' ← 전환':'';
    log.innerHTML+=`<div class="req-line ok"><span class="ts">[${ts}]</span> <span class="ok">✅</span> <span class="rev">${rev}</span>${marker}</div>`;
    log.scrollTop=log.scrollHeight;
    i++;
  },200);
}

let voiceEnabled=true, speaking=false, koVoice=null;

function loadKoVoice(){
  const voices=speechSynthesis.getVoices();
  const female=voices.filter(v=>v.lang.startsWith('ko'));
  koVoice=female.find(v=>/female|여/i.test(v.name))||female.find(v=>/google/i.test(v.name))||female[0]||null;
}
speechSynthesis.onvoiceschanged=loadKoVoice;
loadKoVoice();

let voiceFallbackTimer=null;
function speakSlide(idx){
  speechSynthesis.cancel();
  clearTimeout(voiceFallbackTimer);
  if(!voiceEnabled||!SCRIPTS[idx]){
    if(playing&&cur<SLIDES.length-1){voiceFallbackTimer=setTimeout(()=>next(),5000);}
    return;
  }
  const u=new SpeechSynthesisUtterance(SCRIPTS[idx]);
  u.lang='ko-KR';
  u.rate=1.05;
  u.pitch=1.1;
  if(koVoice)u.voice=koVoice;
  speaking=true;
  u.onend=()=>{
    speaking=false;
    if(playing&&cur<SLIDES.length-1){setTimeout(()=>next(),800);}
    else if(playing&&cur===SLIDES.length-1){stopPlay();}
  };
  u.onerror=()=>{
    speaking=false;
    if(playing&&cur<SLIDES.length-1){setTimeout(()=>next(),3000);}
  };
  speechSynthesis.speak(u);
  voiceFallbackTimer=setTimeout(()=>{
    if(playing&&speaking){speechSynthesis.cancel();speaking=false;if(cur<SLIDES.length-1)next();else stopPlay();}
  },60000);
}

function toggleVoice(){
  voiceEnabled=!voiceEnabled;
  document.getElementById('voiceBtn').innerHTML=voiceEnabled?'🔊 음성':'🔇 음소거';
  if(!voiceEnabled)speechSynthesis.cancel();
}

function toggleFS(){
  if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(()=>{});}
  else{document.exitFullscreen();}
}
document.addEventListener('fullscreenchange',()=>{
  document.getElementById('fsBtn').innerHTML=document.fullscreenElement?'⛶ 나가기':'⛶ 전체화면';
});

// ── 슬라이드 제어 ──
let cur=0, playing=false, playTimer=null;

function render(){
  const stage=document.getElementById('stage');
  // 기존 슬라이드 exit
  const old=stage.querySelector('.slide.active');
  if(old){old.classList.remove('active');old.classList.add('exit');setTimeout(()=>old.remove(),500);}
  // 새 슬라이드
  const div=document.createElement('div');
  div.className='slide';
  div.innerHTML=SLIDES[cur].build();
  stage.appendChild(div);
  requestAnimationFrame(()=>requestAnimationFrame(()=>div.classList.add('active')));
  // 버튼 상태
  document.getElementById('prevBtn').disabled=cur===0;
  document.getElementById('nextBtn').disabled=cur===SLIDES.length-1;
  document.getElementById('stepTitle').textContent=SLIDES[cur].title;
  // dots
  const dots=document.getElementById('stepDots');
  dots.innerHTML=SLIDES.map((_,i)=>`<div class="step-dot ${i===cur?'active':i<cur?'done':''}"></div>`).join('');
  // TTS — 자동 재생 중일 때만 음성 재생
  if(playing){setTimeout(()=>speakSlide(cur),600);}
}

function next(){if(cur<SLIDES.length-1){cur++;render();}else{stopPlay()}}
function prev(){if(cur>0){cur--;render();}}
function togglePlay(){
  if(playing){stopPlay();}
  else{
    playing=true;
    document.getElementById('playBtn').innerHTML='⏸ 일시정지';
    if(voiceEnabled){
      speakSlide(cur);
    } else {
      playTimer=setInterval(()=>{if(cur<SLIDES.length-1)next();else stopPlay();},6000);
    }
  }
}
function stopPlay(){playing=false;clearInterval(playTimer);speechSynthesis.cancel();document.getElementById('playBtn').innerHTML='▶ 자동 재생';}

// 키보드
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'){e.preventDefault();prev();}
  else if(e.key==='p'||e.key==='P'){togglePlay();}
});

render();
</script>
